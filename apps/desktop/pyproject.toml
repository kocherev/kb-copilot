[project]
name = "kb-desktop"
version = "0.0.0"
description = "macOS helper that shows the support agent the screen and performs the actions the user approves."
requires-python = ">=3.12"
dependencies = [
  "livekit>=1.1,<2",
  "pydantic>=2.10",
  "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
  "pyobjc-framework-ScreenCaptureKit>=10; sys_platform == 'darwin'",
]

[project.scripts]
kb-desktop = "kb_desktop.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_desktop"]
