[project]
name = "kb-agent"
version = "0.0.0"
description = "LiveKit Agents worker for the support session."
requires-python = ">=3.12"
dependencies = [
  "kb-rag",
  "livekit-agents[google]>=1.8,<2",
  "pillow>=10",
]

[tool.uv.sources]
kb-rag = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_agent"]
