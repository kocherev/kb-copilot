[project]
name = "kb-agent"
version = "0.0.0"
description = "LiveKit Agents worker for the support session."
requires-python = ">=3.12"
dependencies = [
  "livekit-agents>=1.8,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_agent"]
