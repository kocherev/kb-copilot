[project]
name = "kb-mcp"
version = "0.0.0"
description = "MCP server for knowledge base search and product config."
requires-python = ">=3.12"
dependencies = [
  "kb-agent",
  "kb-rag",
  "mcp>=2.3,<3",
]

[project.scripts]
kb-mcp = "kb_mcp.server:main"

[tool.uv.sources]
kb-agent = { workspace = true }
kb-rag = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_mcp"]
