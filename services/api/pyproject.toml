[project]
name = "kb-api"
version = "0.0.0"
description = "HTTP API for knowledge base documents and product config."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "kb-rag",
  "livekit-api>=1.2,<2",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "python-multipart>=0.0.12",
  "uvicorn>=0.32",
]

[tool.uv.sources]
kb-rag = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_api"]
