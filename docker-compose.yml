services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-me}
      POSTGRES_DB: ${POSTGRES_DB:-kb}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
      # /readyz is plain text. The script checks the HTTP status line, not a JSON body.
      - ./scripts/qdrant_ready.sh:/qdrant_ready.sh:ro
    healthcheck:
      test: ["CMD", "bash", "/qdrant_ready.sh"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Applies the API's Alembic migrations once, then exits.
  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["alembic", "-c", "services/api/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kb}:${POSTGRES_PASSWORD:-replace-me}@postgres:5432/${POSTGRES_DB:-kb}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    volumes:
      # Models download once and survive restarts. CI points this at its cache.
      - ${FASTEMBED_CACHE_DIR:-fastembed}:/home/app/.cache/fastembed
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kb}:${POSTGRES_PASSWORD:-replace-me}@postgres:5432/${POSTGRES_DB:-kb}
      # The API verifies Better Auth JWTs against the web app's key set.
      AUTH_JWKS_URL: http://web:3000/api/auth/jwks
      AUTH_ISSUER: ${BETTER_AUTH_URL:-http://localhost:3000}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-replace-me}
      SESSION_RATE_LIMIT: ${SESSION_RATE_LIMIT:-10}
      LIVEKIT_TOKEN_TTL_SECONDS: ${LIVEKIT_TOKEN_TTL_SECONDS:-900}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      # ONNX threads for the embedding models. Indexing keeps this many cores busy.
      KB_EMBED_THREADS: ${KB_EMBED_THREADS:-2}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      # The browser joins LIVEKIT_URL. Dispatch runs inside this container.
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_URL: ${LIVEKIT_API_URL:-${LIVEKIT_AGENT_URL:-${LIVEKIT_URL:-ws://localhost:7880}}}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LINEAR_CLIENT_ID: ${LINEAR_CLIENT_ID:-}
      LINEAR_CLIENT_SECRET: ${LINEAR_CLIENT_SECRET:-}
      LINEAR_REDIRECT_URI: ${LINEAR_REDIRECT_URI:-http://localhost:3000/api/integrations/linear/callback}
      LINEAR_TOKEN_KEY: ${LINEAR_TOKEN_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: kb-api
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Server components fetch the API over the Compose network.
      API_INTERNAL_URL: http://api:8000
      # Better Auth tables live in the same Postgres. The web app migrates them on start.
      DATABASE_URL: postgresql://${POSTGRES_USER:-kb}:${POSTGRES_PASSWORD:-replace-me}@postgres:5432/${POSTGRES_DB:-kb}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-replace-me}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    environment:
      # Browser-facing LIVEKIT_URL stays on the API. The agent uses the URL it can reach.
      LIVEKIT_URL: ${LIVEKIT_AGENT_URL:-${LIVEKIT_URL:-ws://localhost:7880}}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      API_URL: http://api:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-replace-me}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      KB_VOICE: ${KB_VOICE:-Puck}
      AGENT_MAX_SESSION_SECONDS: ${AGENT_MAX_SESSION_SECONDS:-600}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: kb-agent
    depends_on:
      api:
        condition: service_healthy

  # Optional local media server. It is not started by `docker compose up`.
  # Enable it with: docker compose --profile livekit up
  livekit:
    image: livekit/livekit-server:v1.13.11
    profiles: ["livekit"]
    restart: unless-stopped
    command: ["--dev", "--bind", "0.0.0.0"]
    # Host ports can move so two stacks fit on one machine. Media over the
    # remapped UDP port needs the default 7882.
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "${LIVEKIT_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_UDP_PORT:-7882}:7882/udp"

  # Optional trace viewer. Enable it with: docker compose --profile observability up
  # and set OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 in .env. Traces are
  # kept in memory, so they are gone when it stops.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
      # For an API or agent run on the host. Containers use http://jaeger:4318.
      - "127.0.0.1:${OTLP_PORT:-4318}:4318"

volumes:
  postgres-data:
  qdrant-data:
  fastembed:
