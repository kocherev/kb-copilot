name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: kb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kb -d kb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-packages --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - name: API tests on Postgres
        run: uv run pytest services/api/tests
        env:
          KB_TEST_DATABASE_URL: postgresql+asyncpg://kb:test-only@localhost:5432/kb_test

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-packages --group dev
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: OpenAPI client is up to date
        run: |
          pnpm openapi
          git diff --exit-code apps/web/openapi.json apps/web/src/lib/api/schema.d.ts

  evals:
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-packages --group dev
      # The key hashes the file that names the default models, so a model
      # change downloads once and later runs reuse the weights.
      - uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-${{ hashFiles('packages/rag/src/kb_rag/models.py') }}
      - run: make eval

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose --profile livekit config --quiet

  smoke:
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
      FASTEMBED_CACHE_DIR: ./.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-packages --group dev
      - uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-${{ hashFiles('packages/rag/src/kb_rag/models.py') }}
      # Download the default models on the runner so the API container reads
      # them from the bind mount instead of fetching 1.2 GB during the smoke.
      - name: Warm the model cache
        run: |
          uv run python -c "from kb_rag.models import DEFAULT_SETTINGS as s; s.dense.query('warm'); s.sparse.query('warm')"
          chmod -R a+rwX .cache/fastembed
      # The agent gets a made-up Google key. The smoke test expects it to tell
      # the room that the model could not start, and fails if the room stays silent.
      - name: Use the dev LiveKit key pair and throwaway secrets
        run: |
          cp .env.example .env
          sed -i -e 's/^LIVEKIT_API_KEY=.*/LIVEKIT_API_KEY=devkey/' \
            -e 's/^LIVEKIT_API_SECRET=.*/LIVEKIT_API_SECRET=secret/' \
            -e 's/^GOOGLE_API_KEY=.*/GOOGLE_API_KEY=ci-not-a-real-key/' \
            -e "s/^BETTER_AUTH_SECRET=.*/BETTER_AUTH_SECRET=$(openssl rand -hex 32)/" \
            -e "s/^INTERNAL_API_TOKEN=.*/INTERNAL_API_TOKEN=$(openssl rand -hex 16)/" .env
      - run: docker compose --profile livekit up -d --build --wait postgres qdrant api web livekit agent
      - run: uv run python scripts/smoke.py
      - run: uv run pytest services/api/tests/test_ingest_live.py
        env:
          KB_LIVE_STORES: "1"
          DATABASE_URL: postgresql://kb:replace-me@localhost:5432/kb
          QDRANT_URL: http://localhost:6333
      - if: failure()
        run: docker compose --profile livekit logs --no-color
      - if: always()
        run: docker compose --profile livekit down -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - run: gitleaks detect --source . --redact --verbose
