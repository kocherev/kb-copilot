[project]
name = "kb-rag"
version = "0.0.0"
description = "Indexing helpers for LlamaIndex and Qdrant."
requires-python = ">=3.12"
dependencies = [
  "llama-index-core>=0.14",
  "pypdf>=5.1",
  "qdrant-client>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_rag"]
