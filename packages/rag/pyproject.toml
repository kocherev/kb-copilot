[project]
name = "kb-rag"
version = "0.0.0"
description = "Parse, chunk, index, and search documents in Qdrant."
requires-python = ">=3.12"
dependencies = [
  "fastembed>=0.7",
  "pypdf>=5.1",
  "qdrant-client>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_rag"]
