[project]
name = "kb-evals"
version = "0.0.0"
description = "Offline retrieval and answer evals for the demo knowledge base."
requires-python = ">=3.12"
dependencies = [
  "kb-agent",
  "kb-rag",
]

[tool.uv.sources]
kb-agent = { workspace = true }
kb-rag = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_evals"]
